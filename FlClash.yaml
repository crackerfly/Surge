  entertainment:  {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-entertainment.mrs',    path: ./ruleset/entertainment.mrs}
  speedtest:      {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/speedtest.mrs',                 path: ./ruleset/speedtest.mrs}
  game_dl_cn:     {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-games@cn.mrs',         path: ./ruleset/game_dl_cn.mrs}
  ads:            {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs',          path: ./ruleset/ads.mrs}
  geolocation_not_cn: {<<: *rp, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs',         path: ./ruleset/geolocation_not_cn.mrs}

# ============================================================================
# 策略组
# 地区正则移植自 Surge policy-regex-filter：补入国旗 emoji、单字中文、三字母代码，
# 并把边界从 [\s_\-\[\]] 换成 [^A-Za-z]（可覆盖括号、竖线、数字、中文等分隔符）。
# empty-fallback 一律为 REJECT：筛空时断网而不是静默直连泄漏（COMPATIBLE 等价于 DIRECT）。
# ============================================================================
proxy-groups:
  # ---------- 主入口 ----------
  - name: Proxies
    type: select
    proxies: [Smatic, Manual, HK, TW, JP, SG, US, KR, Automatic, Fallback, Balance]
    default-selected: Smatic

  # Surge: Smatic = 优质线路，且排除 香港 与 AI 专用节点。这里用 filter(正向) + exclude-filter(负向) 等价表达。
  - name: Smatic
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)(三网|三網|专线|專線|高速|电信|電信|CN2|IEPL|IPLC|GIA|BGP|IPv6)'
    exclude-filter: '(?i)(🇭🇰|香港|港|Hong ?Kong|HongKong|(?:^|[^A-Za-z])(?:HKG|HK)(?:[^A-Za-z]|$)|(?:^|[^A-Za-z])AI(?:[^A-Za-z]|$))'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  # ---------- 场景组 ----------
  # Surge: Agentic 优先 AI 标记节点，其次 SG(0.4) → TW(0.8) → 其他。fallback 按顺序取第一个健康的。
  - name: Agentic
    type: fallback
    proxies: [SG, TW, JP, US, AgenticAI]
    empty-fallback: REJECT
    <<: *hc

  - name: AgenticAI
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)((?:^|[^A-Za-z])AI(?:[^A-Za-z]|$)|(?:^|[^A-Za-z])GPT(?:[^A-Za-z]|$)|Claude|OpenAI|ChatGPT)'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  # Surge: Google 组要求 (优质线路) AND (JP|SG|TW) AND NOT IPv6。
  # RE2 无法表达两个正向条件的 AND，这里保留地区约束 + 排除 IPv6 标记，
  # 由 url-test 的最低延迟排序间接优选优质线路。
  - name: Google
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|名古屋|Japan|Tokyo|Osaka|(?:^|[^A-Za-z])(?:JPN|JP)(?:[^A-Za-z]|$)|🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])(?:SGP|SG)(?:[^A-Za-z]|$)|🇹🇼|台湾|臺灣|台灣|台北|臺北|Taiwan|Taipei|(?:^|[^A-Za-z])(?:TWN|TW)(?:[^A-Za-z]|$))'
    exclude-filter: '(?i)(?:^|[^A-Za-z])IPv6(?:[^A-Za-z]|$)'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  - name: Creative
    type: select
    proxies: [Smatic, Proxies, US, JP, TW, SG, HK, Manual]
    default-selected: Smatic

  - name: Coding
    type: select
    proxies: [Smatic, Proxies, HK, US, JP, TW, SG, KR, Manual]
    default-selected: Smatic

  - name: GlobalMedia
    type: select
    proxies: [SG, JP, TW, HK, US, Proxies, Manual]
    default-selected: SG

  # Surge: AdGuard = Domestic / FakeOverwrite(reject-tinygif) / Reject(reject-drop) / Manual
  # mihomo 无 reject-tinygif；REJECT 返回错误，REJECT-DROP 静默丢弃。
  - name: AdGuard
    type: select
    proxies: [DIRECT, REJECT, REJECT-DROP, Manual]
    default-selected: DIRECT

  - name: Manual
    type: select
    use: [NodeList, SecondNodeList]
    proxies: [Smatic, Automatic, Fallback, Balance, DIRECT]
    empty-fallback: REJECT

  - name: Final
    type: select
    proxies: [Smatic, Google, Proxies, SG, JP, TW, Manual, DIRECT]
    default-selected: Smatic

  # ---------- 地区组 ----------
  - name: HK
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)(🇭🇰|香港|港|Hong ?Kong|HongKong|(?:^|[^A-Za-z])(?:HKG|HK)(?:[^A-Za-z]|$))'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  - name: TW
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)(🇹🇼|台湾|臺灣|台灣|台北|臺北|新北|桃园|桃園|彰化|Taiwan|Taipei|(?:^|[^A-Za-z])(?:TWN|TW)(?:[^A-Za-z]|$))'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  - name: JP
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|名古屋|埼玉|川口|Japan|Tokyo|Osaka|Nagoya|(?:^|[^A-Za-z])(?:JPN|JP)(?:[^A-Za-z]|$))'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  - name: SG
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)(🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])(?:SGP|SG)(?:[^A-Za-z]|$))'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  - name: US
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)(🇺🇸|美国|美國|美西|美東|美东|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|达拉斯|達拉斯|凤凰城|鳳凰城|United ?States|America|Los ?Angeles|San ?Jose|Seattle|New ?York|Dallas|(?:^|[^A-Za-z])(?:USA|US)(?:[^A-Za-z]|$))'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  - name: KR
    type: url-test
    use: [NodeList, SecondNodeList]
    filter: '(?i)(🇰🇷|韩国|韓國|首尔|首爾|South ?Korea|Korea|Seoul|(?:^|[^A-Za-z])(?:KOR|KR)(?:[^A-Za-z]|$))'
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  # ---------- 全局自动 ----------
  - name: Automatic
    type: url-test
    use: [NodeList, SecondNodeList]
    empty-fallback: REJECT
    tolerance: 90
    <<: *hc

  - name: Fallback
    type: fallback
    use: [NodeList, SecondNodeList]
    empty-fallback: REJECT
    <<: *hc

  - name: Balance
    type: load-balance
    use: [NodeList, SecondNodeList]
    strategy: consistent-hashing
    empty-fallback: REJECT
    <<: *hc

# ============================================================================
# 规则；顺序参照 Surge [Rule]
# ============================================================================
rules:
  # --- 阶段 0：自身、内网、DNS 基础设施 ---
  - IP-CIDR,0.0.0.0/32,REJECT-DROP,no-resolve
  - IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,192.0.0.0/24,DIRECT,no-resolve
  - IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
  - IP-CIDR,192.88.99.0/24,DIRECT,no-resolve
  - IP-CIDR,198.51.100.0/24,DIRECT,no-resolve
  - IP-CIDR,203.0.113.0/24,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
  - IP-CIDR6,::/128,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - DOMAIN-KEYWORD,mdns,DIRECT
  - DOMAIN,_services._dns-sd._udp.local,DIRECT
  - DOMAIN,_airplay._tcp.local,DIRECT
  - DOMAIN,_googlecast._tcp.local,DIRECT
  - PROCESS-NAME,FlClash.exe,DIRECT
  - PROCESS-NAME,FlClashCore.exe,DIRECT
  - PROCESS-PATH-WILDCARD,/Applications//Volumes/FlClash/*,DIRECT
  # DNS 服务器域名与 IP 必须直连，否则解析套娃（IP 列表移植自 Surge [Rule] DNS Direct 段）
  - DOMAIN-SUFFIX,alidns.com,DIRECT
  - DOMAIN,doh.pub,DIRECT
  - DOMAIN,dns.google,DIRECT
  - IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
  - IP-CIDR,223.6.6.6/32,DIRECT,no-resolve
  - IP-CIDR,119.29.29.29/32,DIRECT,no-resolve
  - IP-CIDR,120.53.53.53/32,DIRECT,no-resolve
  - IP-CIDR,1.12.12.12/32,DIRECT,no-resolve
  - IP-CIDR,180.76.76.76/32,DIRECT,no-resolve
  - IP-CIDR,180.184.2.2/32,DIRECT,no-resolve
  - IP-CIDR,210.0.255.251/32,DIRECT,no-resolve
  - IP-CIDR,168.95.1.1/32,DIRECT,no-resolve
  - IP-CIDR,64.6.65.6/32,DIRECT,no-resolve
  - IP-CIDR,149.112.112.10/32,DIRECT,no-resolve
  # 联网探测 / 时间同步 / 局域网发现
  - DOMAIN-SUFFIX,msftconnecttest.com,DIRECT
  - DOMAIN-SUFFIX,msftncsi.com,DIRECT
  - DOMAIN,time.windows.com,DIRECT
  - DOMAIN,time.nist.gov,DIRECT
  - DOMAIN-SUFFIX,pool.ntp.org,DIRECT
  - DOMAIN,time.cloudflare.com,DIRECT
  - DST-PORT,123,DIRECT
  - DST-PORT,5353,DIRECT
  - DST-PORT,1900,DIRECT

  # --- 阶段 1：国内域名 ---
  - RULE-SET,cn_domain,DIRECT

  # --- 阶段 2：测速与游戏下载强制直连（Surge: Speedtest / GameDownloadCN → DIRECT）---
  - RULE-SET,speedtest,DIRECT
  - RULE-SET,game_dl_cn,DIRECT

  # --- 阶段 3：Midjourney 与其依赖的 Discord，必须先于 AI 通用规则 ---
  - DOMAIN-SUFFIX,midjourney.com,Creative
  - DOMAIN-SUFFIX,midjourneycdn.com,Creative
  - DOMAIN-SUFFIX,discord.com,Creative
  - DOMAIN-SUFFIX,discordapp.com,Creative
  - DOMAIN-SUFFIX,discordapp.net,Creative
  - DOMAIN-SUFFIX,discord.media,Creative

  # --- 阶段 4：Agentic ---
  # 进程名请以 FlClash 连接面板中的实际值为准；下列为常见默认值。
  - DOMAIN-SUFFIX,chatgpt.com,Agentic
  - DOMAIN-SUFFIX,openai.com,Agentic
  - DOMAIN-SUFFIX,oaistatic.com,Agentic
  - DOMAIN-SUFFIX,oaiusercontent.com,Agentic
  - DOMAIN-SUFFIX,claude.ai,Agentic
  - DOMAIN-SUFFIX,anthropic.com,Agentic
  - DOMAIN-SUFFIX,claudeusercontent.com,Agentic
  - DOMAIN,gemini.google.com,Agentic
  - DOMAIN,aistudio.google.com,Agentic
  - DOMAIN,generativelanguage.googleapis.com,Agentic
  - DOMAIN,alkalimakersuite-pa.clients6.google.com,Agentic
  - RULE-SET,ai,Agentic
  - RULE-SET,cursor,Agentic
  - PROCESS-NAME,ChatGPT.exe,Agentic
  - PROCESS-NAME,Claude.exe,Agentic
  - PROCESS-NAME,claude.exe,Agentic
  - PROCESS-NAME,codex.exe,Agentic
  - PROCESS-NAME,gemini.exe,Agentic
  - PROCESS-NAME,Cursor.exe,Agentic
  - PROCESS-PATH-WILDCARD,/Applications/ChatGPT.app/*,Agentic
  - PROCESS-PATH-WILDCARD,/Applications/Claude.app/*,Agentic
  - PROCESS-PATH-WILDCARD,/Applications/Codex.app/*,Agentic
  - PROCESS-PATH-WILDCARD,/Applications/Gemini.app/*,Agentic
  - PROCESS-PATH-WILDCARD,/Applications/Cursor.app/*,Agentic

  # --- 阶段 4.5：Cloudflare → Smatic ---
  # 必须排在 ai / cursor 之后：CF 后面的 AI 服务先被上面的规则截走，剩下的普通 CF 站点才落到这里。
  # geosite/cloudflare 覆盖面极广（CF 托管了大量普通网站），塞进 Agentic 那条窄链不合适，
  # 交给 Smatic 的优质线路池更合理。
  - RULE-SET,cloudflare,Agentic

  # --- 阶段 5：创意软件 ---
  - RULE-SET,adobe,DIRECT
  - RULE-SET,figma,Creative
  - RULE-SET,canva,Creative
  - RULE-SET,pinterest,Creative
  - PROCESS-NAME,Photoshop.exe,DIRECT
  - PROCESS-NAME,Illustrator.exe,Creative
  - PROCESS-NAME,AfterFX.exe,Creative
  - PROCESS-NAME,Adobe Premiere Pro.exe,Creative
  - PROCESS-NAME,Figma.exe,Creative
  - PROCESS-NAME,Canva.exe,Creative
  - PROCESS-PATH-WILDCARD,/Applications/Figma.app/*,Creative
  - PROCESS-PATH-WILDCARD,/Applications/Adobe*,DIRECT
  - PROCESS-PATH-WILDCARD,/Applications/Canva.app/*,Creative

  # --- 阶段 6：编码工具 ---
  # git 的网络连接由子进程 git-remote-https.exe 发起；Docker 拉镜像由 com.docker.backend.exe 发起。
  - RULE-SET,github,Coding
  - RULE-SET,docker,Coding
  - RULE-SET,dev,Coding
  - PROCESS-NAME,Code.exe,Coding
  - PROCESS-NAME,Windsurf.exe,Coding
  - PROCESS-NAME,git-remote-https.exe,Coding
  - PROCESS-NAME,gh.exe,Coding
  - PROCESS-NAME,GitHubDesktop.exe,Coding
  - PROCESS-NAME,com.docker.backend.exe,Coding
  - PROCESS-PATH-WILDCARD,/Applications/Visual Studio Code.app/*,Coding
  - PROCESS-PATH-WILDCARD,/Applications/Windsurf.app/*,Coding
  - PROCESS-PATH-WILDCARD,/Applications/GitHub Desktop.app/*,Coding
  - PROCESS-NAME-WILDCARD,git-remote-*,Coding
  - PROCESS-NAME,gh,Coding
  - PROCESS-NAME-WILDCARD,com.docker.*,Coding

  # --- 阶段 7：Google 与 YouTube 同组 ---
  # 两者共用 Google 策略组，DNS 侧也共用同一组解析服务器（见 nameserver-policy）。
  # youtube 必须在前：geosite/google 与 geosite/youtube 有域名重叠，先匹配到哪条就用哪条，
  # 目标相同所以结果一致，但顺序固定下来便于日后单独把 youtube 拆去 GlobalMedia。
  - RULE-SET,youtube,Google
  - RULE-SET,google,Google

  # --- 阶段 8：Telegram / 其他常用外站 ---
  - RULE-SET,telegram,Proxies
  - RULE-SET,telegram_ip,Proxies,no-resolve
  - RULE-SET,bing,Proxies
  - RULE-SET,paypal,Proxies

  # --- 阶段 9：全球媒体 ---
  - RULE-SET,media,GlobalMedia
  - RULE-SET,entertainment,GlobalMedia
  - PROCESS-NAME,Spotify.exe,GlobalMedia
  - PROCESS-PATH-WILDCARD,/Applications/Spotify.app/*,GlobalMedia

  # --- 阶段 10：广告（AdGuard 组默认 DIRECT，可在 UI 改 REJECT-DROP）---
  - RULE-SET,ads,AdGuard

  # --- 阶段 11：非中国地理域名 ---
  - RULE-SET,geolocation_not_cn,Proxies

  # --- 阶段 12：中国 IP 直连 ---
  # 与 Surge 的 GEOIP,CN,DIRECT 一致，故意不加 no-resolve：
  # 未命中前面任何域名规则的目标会先解析再按 IP 归属分流，代价是一次解析延迟。
  # 若更看重速度、接受"未知域名一律走代理"的白名单语义，把 no-resolve 加回来。
  - RULE-SET,cn_ip,DIRECT

  # --- 阶段 13：兜底 ---
  - MATCH,Final
