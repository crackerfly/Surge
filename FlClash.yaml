  cursor:         {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cursor.mrs',                    path: ./ruleset/cursor.mrs}
  cloudflare:     {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cloudflare.mrs',                path: ./ruleset/cloudflare.mrs}
  adobe:          {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/adobe.mrs',                     path: ./ruleset/adobe.mrs}
  figma:          {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/figma.mrs',                     path: ./ruleset/figma.mrs}
