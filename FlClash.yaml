  telegram_ip:    {<<: *rpip, url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs',                    path: ./ruleset/telegram_ip.mrs}
  bing:           {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/bing.mrs',                      path: ./ruleset/bing.mrs}
