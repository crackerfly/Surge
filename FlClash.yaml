  pinterest:      {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/pinterest.mrs',                 path: ./ruleset/pinterest.mrs}
  github:         {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs',                    path: ./ruleset/github.mrs}
  docker:         {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/docker.mrs',                    path: ./ruleset/docker.mrs}
  dev:            {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-dev.mrs',              path: ./ruleset/dev.mrs}
  google:         {<<: *rp,   url: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.mrs',                    path: ./ruleset/google.mrs}
